<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('lifeos-ui-store');
          var theme = 'system';
          var accent = 'zinc';
          if (raw) {
            var data = JSON.parse(raw);
            if (data.state) {
              if (data.state.theme) theme = data.state.theme;
              if (data.state.accentTheme && ['zinc','blue','green','violet','rose','amber'].indexOf(data.state.accentTheme) >= 0) accent = data.state.accentTheme;
            }
          }
          var resolved = theme;
          if (theme === 'system' || !theme) {
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            resolved = prefersDark ? 'dark' : 'light';
          }
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(resolved);
          document.documentElement.setAttribute('data-accent', accent);
          document.documentElement.style.colorScheme = resolved;
          var headerColor = resolved === 'dark' ? '#1c1c1e' : '#f9f9f9';
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          if (metas && metas.length > 0) {
            metas.forEach(function(m) { m.setAttribute('content', headerColor); });
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-accent', 'zinc');
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1c1c1e" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f9f9f9" />
    <meta name="theme-color" content="#1c1c1e" />
