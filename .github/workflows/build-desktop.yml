name: Build & Release Desktop (Pake)

# Triggers on version tag push only (e.g. v1.0.3, v2.0.0).
# Each tag push creates/updates a GitHub Release with Windows and Linux packages + changelog.
on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (e.g. 1.2.0) — leave blank to read from package.json'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows MSI
    runs-on: windows-latest
    outputs:
      app_version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history needed for changelog generation

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Determine Version
        id: get_version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "✅ Building version: ${VERSION}"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web bundle for Pake
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
        run: pnpm run build:pake

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '~/.cargo -> ~/.cargo'

      - name: Install Pake CLI
        run: npm install -g pake-cli

      - name: Patch Pake configuration (updater endpoint + version)
        env:
          TAURI_PUBLIC_KEY: ${{ secrets.TAURI_PUBLIC_KEY }}
          APP_VERSION: ${{ env.VERSION }}
        run: node scripts/patch-pake-config.js

      - name: Patch Pake tray support (runtime show/hide AppIndicator)
        run: node scripts/patch-pake-tray.js

      - name: Build Application with Pake
        shell: bash
        run: |
          pake dist/index.html \
            --name "lifeOS" \
            --icon public/icon-main.ico \
            --hide-title-bar \
            --show-system-tray \
            --hide-on-close \
            --inject scripts/pake-inject.js \
            --iterative-build \
            --use-local-file \
            --app-version "${{ env.VERSION }}"
          # Normalise output file names (Pake may produce various casings)
          mv [lL]ife[oO][sS]*.exe lifeOS.exe || true
          mv [lL]ife[oO][sS]*.msi lifeOS.msi || true

      - name: Generate updater.json and sign MSI zip
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          APP_VERSION: ${{ env.VERSION }}
        run: node scripts/generate-tauri-updater.js

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-app-windows
          path: |
            lifeOS.exe
            lifeOS.msi
            lifeOS.msi.zip
            updater.json
          if-no-files-found: error
          retention-days: 7

  build-linux:
    name: Build Linux (.deb & .AppImage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Determine Version
        id: get_version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "✅ Building Linux version: ${VERSION}"

      - name: Install system dependencies (WebKitGTK & build tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2t64 || sudo apt-get install -y libfuse2 || true

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web bundle for Pake
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
        run: pnpm run build:pake

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '~/.cargo -> ~/.cargo'

      - name: Install Pake CLI
        run: |
          npm install -g pake-cli || sudo npm install -g pake-cli
          sudo chown -R $USER:$(id -gn) "$(npm root -g)" 2>/dev/null || true
          sudo chown -R $USER:$(id -gn) /usr/local/lib/node_modules 2>/dev/null || true

      - name: Patch Pake configuration
        env:
          APP_VERSION: ${{ env.VERSION }}
        run: node scripts/patch-pake-config.js

      - name: Patch Pake tray support (runtime show/hide AppIndicator)
        run: node scripts/patch-pake-tray.js

      - name: Build Linux Native Packages with Pake
        shell: bash
        run: |
          pake dist/index.html \
            --name "lifeOS" \
            --icon public/icon-main.png \
            --show-system-tray \
            --hide-on-close \
            --inject scripts/pake-inject.js \
            --iterative-build \
            --use-local-file \
            --app-version "${{ env.VERSION }}"
          # Find and normalise output files (.deb, .AppImage)
          mkdir -p linux-dist
          find . -maxdepth 3 -name "*[lL]ife[oO][sS]*.deb" -exec cp {} linux-dist/lifeOS_${{ env.VERSION }}_amd64.deb \;
          find . -maxdepth 3 -name "*[lL]ife[oO][sS]*.AppImage" -exec cp {} linux-dist/lifeOS_${{ env.VERSION }}_amd64.AppImage \;

      - name: Clean up Linux desktop entries
        shell: bash
        run: |
          # Find the generated .deb file
          DEB=$(find . -maxdepth 3 -name "*[lL]ife[oO][sS]*.deb" | head -n1)
          if [ -z "$DEB" ]; then
            echo "⚠️ No .deb found; skipping desktop entry cleanup."
            exit 0
          fi

          # Extract it to a temporary folder
          mkdir -p deb-unpacked
          dpkg-deb -R "$DEB" deb-unpacked

          # Remove the unwanted duplicate entry
          rm -f deb-unpacked/usr/share/applications/lifeos.desktop

          # Edit the remaining entry to enable GPU compositing
          sed -i 's|^Exec=pake-lifeos|Exec=env WEBKIT_DISABLE_COMPOSITING_MODE=0 WEBKIT_DISABLE_DMABUF_RENDERER=0 pake-lifeos|' \
            deb-unpacked/usr/share/applications/com.pake.lifeos.desktop

          # Re-package the .deb
          dpkg-deb -b deb-unpacked cleaned.deb
          mv cleaned.deb "$DEB"

      - name: Build Browser Extension Zip
        shell: bash
        run: |
          sudo apt-get install -y zip || true
          node scripts/build-extension.js

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-app-linux
          path: |
            linux-dist/*
            lifeOS-extension.zip
          if-no-files-found: warn
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate Changelog
        id: changelog
        shell: bash
        run: |
          VERSION="v${{ needs.build-windows.outputs.app_version }}"
          DATE_READABLE=$(date +'%B %d, %Y')

          # Find the previous release tag to diff against (ignores date-based tags, sorts semver correctly)
          PREV_TAG=$(VERSION="${VERSION}" node -e '
            const { execSync } = require("child_process");
            const tags = execSync("git tag").toString().split("\n")
              .map(t => t.trim())
              .filter(t => /^v\d+\.\d+\.\d+$/.test(t));
            tags.sort((a, b) => {
              const parse = t => t.slice(1).split(".").map(Number);
              const [aMaj, aMin, aPat] = parse(a);
              const [bMaj, bMin, bPat] = parse(b);
              if (aMaj !== bMaj) return bMaj - aMaj;
              if (aMin !== bMin) return bMin - aMin;
              return bPat - aPat;
            });
            const version = process.env.VERSION;
            const currentIndex = tags.indexOf(version);
            let prevTag = "";
            if (currentIndex !== -1 && currentIndex + 1 < tags.length) {
              prevTag = tags[currentIndex + 1];
            } else if (tags.length > 0) {
              prevTag = tags.find(t => t !== version) || "";
            }
            console.log(prevTag);
          ')
          echo "Previous tag: ${PREV_TAG:-none}"

          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges)
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges -30)
          fi

          # Build changelog body
          {
            echo "body<<CHANGELOG_EOF"
            echo "# lifeOS ${VERSION} — ${DATE_READABLE}"
            echo ""
            echo "## What's Changed"
            echo ""
            if [ -n "$COMMITS" ]; then
              echo "$COMMITS"
            else
              echo "- No notable changes"
            fi
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "**Full diff:** [\`${PREV_TAG}..${VERSION}\`](https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${VERSION})"
            fi
            echo "CHANGELOG_EOF"
          } >> $GITHUB_OUTPUT

          echo "tag=${VERSION}" >> $GITHUB_OUTPUT
          echo "name=lifeOS ${VERSION} (${DATE_READABLE})" >> $GITHUB_OUTPUT

      - name: Create or update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.changelog.outputs.tag }}
          RELEASE_NAME: ${{ steps.changelog.outputs.name }}
          RELEASE_BODY: ${{ steps.changelog.outputs.body }}
        shell: bash
        run: |
          # RELEASE_BODY contains backticks (e.g. `v1.10.0..v1.10.1`) and other
          # shell metacharacters — splicing it directly into this script via a
          # GitHub Actions expression (as opposed to referencing the env var)
          # would let bash try to command-substitute it, failing with
          # "...: command not found".
          # Delete existing release for this tag if it exists (allows re-running)
          gh release delete "$TAG" --yes 2>/dev/null || true

          # actions/upload-artifact preserves the source directory structure,
          # so the merged release-artifacts/ tree can contain subdirectories
          # (e.g. release-artifacts/linux-dist/) alongside the files — gh
          # release create rejects a directory as an asset, so only pass it
          # actual files instead of a glob that can match one.
          mapfile -t ASSETS < <(find release-artifacts -type f)

          gh release create "$TAG" \
            --title "$RELEASE_NAME" \
            --notes "$RELEASE_BODY" \
            --latest \
            "${ASSETS[@]}"
